{% assign profile = site.data.profile %}
<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ profile.name_zh }} <span>{{ profile.name }}</span></a>
    <nav class="site-nav" aria-label="Site navigation">
      <a{% if page.url == '/' %} class="is-active"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a{% if page.url contains '/publications' %} class="is-active"{% endif %} href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/#footprints-title' | relative_url }}">Footprints</a>
      <a href="{{ profile.cv }}">CV</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark theme" title="Switch theme">
        <span class="theme-sun" aria-hidden="true">☼</span><span class="theme-moon" aria-hidden="true">☾</span>
      </button>
    </nav>
  </div>
</header>
