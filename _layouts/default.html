<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ site.description }}" />
    <title>
      {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
    </title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    {% if page.footprint_map %}
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css"
      />
    {% endif %}
  </head>
  <body>
    {% include sidebar.html %}
    <main class="site-shell">
      <section class="content">{{ content }}</section>
    </main>
    <script>
      (function () {
        var button = document.querySelector("[data-theme-toggle]");
        var languageButton = document.querySelector("[data-language-toggle]");
        var stored = localStorage.getItem("site-theme");
        if (stored) document.documentElement.dataset.theme = stored;
        if (button) {
          button.addEventListener("click", function () {
            var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = next;
            localStorage.setItem("site-theme", next);
            button.setAttribute("aria-label", next === "dark" ? "Use light theme" : "Use dark theme");
          });
        }

        function setLanguage(language) {
          document.documentElement.lang = language;
          document.documentElement.dataset.language = language;
          document.querySelectorAll("[data-en][data-zh]").forEach(function (element) {
            element.textContent = element.dataset[language];
          });
          if (languageButton) {
            languageButton.setAttribute("aria-pressed", language === "zh" ? "true" : "false");
            languageButton.setAttribute("aria-label", language === "zh" ? "Switch to English" : "切换为中文");
            languageButton.querySelector("[data-language-label]").textContent = language === "zh" ? "中" : "EN";
          }
          localStorage.setItem("site-language", language);
        }

        setLanguage(localStorage.getItem("site-language") === "zh" ? "zh" : "en");
        if (languageButton) {
          languageButton.addEventListener("click", function () {
            setLanguage(document.documentElement.dataset.language === "zh" ? "en" : "zh");
          });
        }
      })();
    </script>
    {% if page.footprint_map %}
      <script
        src="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js"
        defer
      ></script>
      <script src="{{ '/assets/js/footpoints.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
